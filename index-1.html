<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b1340">
<title>Star</title>
<style>
:root{--bg:#120d2b;--card:#241a52;--me:#7c4dff;--txt:#f3eeff;--mut:#a99cd6}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--txt);font-family:system-ui,sans-serif;display:flex;flex-direction:column}
header{padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top));background:#1b1340;display:flex;align-items:center;gap:10px}
header h1{font-size:20px;margin:0;flex:1}
header button{background:none;border:0;color:var(--txt);font-size:20px}
#chat{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.m{max-width:85%;padding:10px 14px;border-radius:16px;white-space:pre-wrap;word-wrap:break-word;line-height:1.4}
.u{align-self:flex-end;background:var(--me);border-bottom-right-radius:4px}
.b{align-self:flex-start;background:var(--card);border-bottom-left-radius:4px}
.m img{max-width:100%;border-radius:12px;display:block}
pre{background:#0a0720;padding:8px;border-radius:8px;overflow-x:auto;white-space:pre}
form{display:flex;gap:8px;padding:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom));background:#1b1340}
input{flex:1;min-width:0;padding:12px;border-radius:22px;border:0;background:var(--card);color:var(--txt);font-size:16px}
form button{width:44px;height:44px;border-radius:50%;border:0;background:var(--me);color:#fff;font-size:18px}
small{display:block;text-align:center;color:var(--mut);padding:4px 12px}
</style>
</head>
<body>
<header><span>⭐</span><h1>Star</h1><button id="voz" title="Ler respostas em voz alta">🔇</button><button id="limpar" title="Limpar conversa">🗑️</button></header>
<div id="chat"></div>
<small>Dica: escreva <b>/imagem</b> e a descrição para criar uma imagem</small>
<form id="f">
<button type="button" id="mic">🎤</button>
<input id="t" placeholder="Fale com a Star..." autocomplete="off">
<button>➤</button>
</form>
<script>
const SISTEMA="Você é a Star, uma assistente de IA simpática. Responda sempre em português do Brasil, de forma clara e curta. Ajude com conversas, estudos, textos e programação (use blocos de código quando necessário).";
const chat=document.getElementById('chat'),t=document.getElementById('t');
let hist=[],falar=false;
try{hist=JSON.parse(localStorage.getItem('star_hist')||'[]')}catch(e){}
function salvar(){try{localStorage.setItem('star_hist',JSON.stringify(hist.slice(-30)))}catch(e){}}
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function fmt(s){return esc(s).replace(/```(?:\w*\n)?([\s\S]*?)```/g,'<pre>$1</pre>')}
function add(cls,html){const d=document.createElement('div');d.className='m '+cls;d.innerHTML=html;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return d}
function dizer(txt){if(!falar||!window.speechSynthesis)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(txt.replace(/```[\s\S]*?```/g,' código '));u.lang='pt-BR';speechSynthesis.speak(u)}
function mostrarHist(){chat.innerHTML='';if(!hist.length)add('b','Oi! Eu sou a Star ⭐ Posso conversar, ajudar com código e criar imagens. Como posso te ajudar?');hist.forEach(m=>add(m.role==='user'?'u':'b',m.img?`<img src="${m.img}">`:fmt(m.content)))}
async function enviar(txt){
 if(txt.toLowerCase().startsWith('/imagem')){
  const p=txt.slice(7).trim();if(!p)return add('b','Escreva o que quer ver. Ex: /imagem gato astronauta');
  add('u',esc(txt));
  const d=add('b','Criando imagem... 🎨 (pode levar até 1 minuto)');
  let tent=0;
  const tentar=()=>{
   tent++;
   const url='https://image.pollinations.ai/prompt/'+encodeURIComponent(p)+'?width=512&height=512&model=flux&seed='+Date.now();
   const im=new Image();
   im.onload=()=>{d.innerHTML='';d.appendChild(im);chat.scrollTop=chat.scrollHeight};
   im.onerror=()=>{
    if(tent<3){d.textContent='Serviço ocupado, tentando de novo... ('+tent+'/3) 🎨';setTimeout(tentar,16000)}
    else d.textContent='Não consegui criar a imagem agora. O serviço gratuito limita 1 imagem a cada 15 segundos. Espere um pouco e tente de novo.';
   };
   im.src=url;
  };
  tentar();
  return;
 }
 add('u',esc(txt));hist.push({role:'user',content:txt});
 const d=add('b','Pensando... ✨');
 try{
  const r=await fetch('https://text.pollinations.ai/openai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'openai',messages:[{role:'system',content:SISTEMA},...hist.slice(-12)]})});
  const j=await r.json();const resp=j.choices[0].message.content;
  d.innerHTML=fmt(resp);hist.push({role:'assistant',content:resp});salvar();dizer(resp);
 }catch(e){d.textContent='Ops, não consegui responder. Verifique a internet e tente de novo.';hist.pop()}
 chat.scrollTop=chat.scrollHeight;
}
document.getElementById('f').onsubmit=e=>{e.preventDefault();const v=t.value.trim();if(!v)return;t.value='';enviar(v)};
document.getElementById('limpar').onclick=()=>{hist=[];salvar();mostrarHist()};
document.getElementById('voz').onclick=function(){falar=!falar;this.textContent=falar?'🔊':'🔇';if(!falar&&window.speechSynthesis)speechSynthesis.cancel()};
document.getElementById('mic').onclick=()=>{
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR)return add('b','Seu navegador não suporta reconhecimento de voz. Use o Chrome.');
 const r=new SR();r.lang='pt-BR';r.onresult=e=>{t.value=e.results[0][0].transcript;document.getElementById('f').requestSubmit()};r.start();
};
mostrarHist();
</script>
</body>
</html>
